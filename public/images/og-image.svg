<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
    aria-label="Tideway Rowing Club">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0c4a6e" />
            <stop offset="100%" stop-color="#075985" />
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.1" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)" />
    <rect y="400" width="1200" height="230" fill="url(#water)" />
    <g stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" opacity="0.9">
        <path d="M120 470 q40 18 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none" />
        <path d="M80 520 q40 18 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none"
            opacity="0.6" />
    </g>
    <!-- Eight shell -->
    <g transform="translate(600 380)">
        <ellipse cx="0" cy="0" rx="270" ry="16" fill="#f8fafc" />
        <ellipse cx="0" cy="-4" rx="250" ry="9" fill="#0c4a6e" />
        <g stroke="#f8fafc" stroke-width="7" stroke-linecap="round">
            <line x1="-180" y1="-12" x2="-230" y2="60" />
            <line x1="-90" y1="-12" x2="-140" y2="60" />
            <line x1="0" y1="-12" x2="-50" y2="60" />
            <line x1="90" y1="-12" x2="40" y2="60" />
            <line x1="180" y1="-12" x2="130" y2="60" />
        </g>
    </g>
    <text x="600" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88"
